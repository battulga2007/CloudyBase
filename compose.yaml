services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloudybase
      DB_USER: cloudybase
      DB_PASSWORD: cloudybase_dev

    ports:
      - "8000:8000"

  db:
    image: postgres:18
    container_name: cloudybase-db

    environment:
      POSTGRES_DB: cloudybase
      POSTGRES_USER: cloudybase
      POSTGRES_PASSWORD: cloudybase_dev

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - cloudybase_postgres_data:/var/lib/postgresql

volumes:
  cloudybase_postgres_data: